# uv workspace root for the Python bundled with this library.
#
# This file makes the repository a workspace, not a distributable: it carries
# no `[project]` table, so nothing here is packaged or published. Each member
# under `members` is its own uv package with its own manifest, `src/` layout,
# and `tests/`. One lock and one environment serve them all, so a kernel edit
# reaches every consumer without a copy, a pin, or a symlink.
#
#   uv run --all-packages pytest      every member's tests
#   uv lock --check                   the lock matches the manifests
#
# A skill's Python lives entirely under `<skill>/scripts/`, which is the
# member: manifest, `src/`, and `tests/` all sit inside it, so the skill
# directory itself stays documentation. Commands run the member's console
# script via `uv run --project`, and docs bind the project path through
# `realpath` first, because uv resolves project paths lexically and an agent
# reaches a skill through the alias `.claude/skills/<name>/`, where the
# workspace root is not a lexical ancestor. Plumbing members (`.corekit`,
# `.github/gate`) hold only code, so they are members at their own roots.

[tool.uv.workspace]
members = [
  ".corekit",
  ".github/gate",
  "caveman/scripts",
  "lit-review/scripts",
  "peer-review/scripts",
  "ponder/scripts",
  "read-pdf/scripts",
  "setup-env/scripts",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11"]

[tool.pytest.ini_options]
# The gate stays deterministic: network tests are opt-in with `-m network`,
# which overrides this default because pytest takes the last -m it is given.
addopts = "--import-mode=importlib --strict-markers -m 'not network'"
markers = [
  "network: reaches a real server; excluded from the default run",
]
testpaths = [
  ".corekit/tests",
  ".github/gate/tests",
  "caveman/scripts/tests",
  "lit-review/scripts/tests",
  "peer-review/scripts/tests",
  "ponder/scripts/tests",
  "read-pdf/scripts/tests",
  "setup-env/scripts/tests",
]

# The typechecker is the second half of the modelling discipline: pydantic
# holds the shapes at runtime, mypy holds them at authoring time. Its plugin
# reads pydantic models, so a wrong field name or type is a CI failure rather
# than a rejection an agent discovers mid-session.
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = [".corekit/src", ".github/gate/src", "caveman/scripts/src", "lit-review/scripts/src", "peer-review/scripts/src", "ponder/scripts/src", "read-pdf/scripts/src", "setup-env/scripts/src"]
strict = true
# Third-party scripts ship no stubs; their absence is not our finding.
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

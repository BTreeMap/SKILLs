# Lint and format gate for the Python bundled with skills.
#
# This repository is documentation first: the root pyproject.toml is a
# workspace marker with no `[project]` table, and the members each declare
# their own floor, so the shared lint policy lives here, stated once for the
# whole tree.
#
#   ruff check --fix .
#   ruff format .

# Rule codes and formatting both move between ruff releases, so a run older
# than this would disagree with CI about a clean tree.
required-version = ">=0.16"

# Every workspace member declares requires-python >=3.11, so no rule can
# rewrite a module into syntax its own manifest forbids. Raise this only after
# every `requires-python` in the repository has risen past it.
target-version = "py311"

# Ruff's default. Measured against the existing scripts before adoption: only
# three lines exceeded it, so the gate matches the prose width already in use
# rather than imposing a new one.
line-length = 88

[lint]
# Correctness first, then the rules that keep a small, long-lived script
# legible. Selected explicitly so the gate does not drift when ruff changes
# its defaults.
select = [
  "F",   # pyflakes: undefined names, unused imports and variables
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "I",   # import sorting, so import order is derived rather than debated
  "UP",  # pyupgrade: stay at the constructs target-version already permits
  "B",   # bugbear: mutable defaults, loop-variable capture, silent excepts
  "C4",  # comprehension shapes
  "SIM", # simplifiable conditionals and context managers
  "RUF", # ruff's own correctness rules
  "PL",  # pylint subset
]

# Nothing is ignored repository-wide. A rule that does not fit one line fits
# that line, so exemptions are `# noqa: RULE` comments carrying their reason at
# the site that earns them: a reader sees the justification beside the code,
# and the rule keeps working everywhere else.
ignore = []

[lint.per-file-ignores]
# A test states its expected value inline, where the literal is the assertion
# itself. Naming it elsewhere moves the expectation away from the check.
"**/tests/**" = ["PLR2004"]

[lint.isort]
# Workspace members resolve as installed distributions, so name them rather
# than letting ruff sort them with third-party packages.
known-first-party = [
  "btm_corekit",
  "btm_ponder",
  "btm_lit_review",
  "btm_peer_review",
  "btm_caveman",
  "btm_read_pdf",
  "btm_setup_env",
  "btm_repo_gate",
]

[format]
docstring-code-format = true

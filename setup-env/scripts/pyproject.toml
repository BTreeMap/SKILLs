[project]
name = "btm-setup-env"
version = "1.0.0"
description = "Typed, userspace, per-project development environment provisioner"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["btm-corekit", "certifi", "httpx[brotli,http2,socks,zstd]>=0.28,<1"]

[project.scripts]
btm-setup-env = "btm_setup_env.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
btm-corekit = { workspace = true }

[project]
name = "btm-lit-review"
version = "1.0.0"
description = "Session engine for literature reviews over OpenAlex, arXiv, and Crossref"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["btm-corekit"]

[project.scripts]
btm-lit-review = "btm_lit_review.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
btm-corekit = { workspace = true }

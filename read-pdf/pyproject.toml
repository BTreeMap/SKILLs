[project]
name = "btm-read-pdf"
version = "1.0.0"
description = "Extract analysis-ready text and metadata from a PDF using pypdf only"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pypdf>=6,<7"]

[project.scripts]
btm-read-pdf = "btm_read_pdf.cli:entrypoint"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

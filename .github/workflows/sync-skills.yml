# Reusable workflow: fast-forward a skills submodule gitlink to its upstream tip
# on every listed branch of the caller. sync-skills.example.yml at the
# repository root is the ready-to-use caller.
#
# Contract: each branch yields exactly one status line - updated, already
# current, skipped, or not synced. The last also raises a ::warning:: naming
# the input to fix. Nothing here fails the run; the next run retries.
#
# Least privilege:
#   - `plan` holds `contents: read` and only decides; `apply` holds the sole
#     `contents: write` and only writes. `git ls-remote`, the one call to a
#     foreign host, is handed no token and runs in the job that cannot write.
#   - Nothing is cloned or checked out: no worktree, no hooks, no credential
#     material in argv, in git config, or on disk.
#
# Signed commits: the bump goes through the Git Data API carrying no author,
# committer, or signature field - the documented condition for GitHub to sign a
# bot commit with its own key. The gitlink survives because a tree entry may be
# mode 160000, which the createCommitOnBranch mutation cannot express. So the
# bumps satisfy a `Require signed commits` ruleset with no signing key, secret,
# or bypass actor, and force=false keeps the ref update a fast-forward.
#
# The upstream URL is the one the API reports for the gitlink; `upstream-url`
# and `upstream-ref` override it. `submodule.<name>.branch` is not consulted -
# `upstream-ref` covers it without a second read.

name: Sync skills submodule

on:
  workflow_call:
    inputs:
      submodule-path:
        description: Path of the skills submodule in the calling repository.
        type: string
        required: false
        default: .github/skills
      branches:
        description: >-
          Whitespace- or comma-separated branch names to sync. Missing
          branches are skipped, not errors.
        type: string
        required: false
        default: main master dev
      upstream-url:
        description: >-
          Upstream https URL to sync from. Default: the URL the calling
          repository records for the submodule.
        type: string
        required: false
        default: ""
      upstream-ref:
        description: >-
          Upstream branch to track. Default: HEAD, the upstream's own
          default branch.
        type: string
        required: false
        default: ""

# Deny-all baseline; each job re-grants the minimum it needs.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the branch heads and the gitlink
    outputs:
      bumps: ${{ steps.resolve.outputs.bumps }}
    steps:
      - name: Read branch state (credentialed, read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHES: ${{ inputs.branches }}
          SUBMODULE_PATH: ${{ inputs.submodule-path }}
        run: |
          set -euo pipefail
          note() { printf '%s\n' "$1" | tee -a "${GITHUB_STEP_SUMMARY}"; }
          skip() { note "- **${b}**: Skipped: $1."; }

          repo="repos/${GITHUB_REPOSITORY}"
          : > "${RUNNER_TEMP}/state.tsv"

          for b in ${BRANCHES//,/ }; do
            head=$(gh api "${repo}/git/ref/heads/${b}" -q .object.sha 2>/dev/null) \
              || { skip 'no branch by that name in this repository'; continue; }
            # jq is the sole constructor of a branch record, so a partial
            # read is unrepresentable downstream. One read yields both the
            # pinned gitlink and its recorded URL; .gitmodules is never parsed.
            record=$(gh api "${repo}/contents/${SUBMODULE_PATH}?ref=${head}" 2>/dev/null \
                     | jq -r --arg b "${b}" --arg head "${head}" \
                         'select(type == "object" and .type == "submodule")
                          | [$b, $head, .sha, .submodule_git_url] | @tsv') || record=''
            [ -n "${record}" ] || { skip "no submodule registered at \`${SUBMODULE_PATH}\`"; continue; }
            printf '%s\n' "${record}" >> "${RUNNER_TEMP}/state.tsv"
          done

      - name: Resolve upstream tips (credential-free)
        id: resolve
        env:
          UPSTREAM_URL: ${{ inputs.upstream-url }}
          UPSTREAM_REF: ${{ inputs.upstream-ref }}
        run: |
          set -euo pipefail
          note() { printf '%s\n' "$1" | tee -a "${GITHUB_STEP_SUMMARY}"; }
          # Every branch ends in exactly one status line, warned or not.
          reject() { m="Not synced: $1."; echo "::warning::${b}: ${m}"; note "- **${b}**: ${m}"; }

          case "${UPSTREAM_REF}" in
            '' | HEAD) ref=HEAD ;;
            *) ref="refs/heads/${UPSTREAM_REF}" ;;
          esac

          : > "${RUNNER_TEMP}/bumps.tsv"
          while IFS=$'\t' read -r b head current url; do
            url="${UPSTREAM_URL:-${url}}"
            case "${url}" in
              https://*) ;;
              *) reject "the upstream URL '${url}' is not https; set the upstream-url input to an https URL"; continue ;;
            esac
            # Untrusted: an upstream sha reaches an API call only through
            # this guard. Empty output and a failed fetch are the same case.
            tip=$(git ls-remote "${url}" "${ref}" | awk 'NR == 1 { print $1 }') || tip=''
            case "${tip}" in
              *[!0-9a-f]* | '') reject "no ${ref} found at ${url}; check the upstream-ref input"; continue ;;
            esac
            [ "${tip}" != "${current}" ] || { note "- **${b}**: Already current at ${current:0:12}."; continue; }
            printf '%s\t%s\t%s\t%s\n' "${b}" "${head}" "${current}" "${tip}" >> "${RUNNER_TEMP}/bumps.tsv"
          done < "${RUNNER_TEMP}/state.tsv"

          { echo 'bumps<<TSV'; cat "${RUNNER_TEMP}/bumps.tsv"; echo TSV; } >> "${GITHUB_OUTPUT}"

  apply:
    needs: plan
    if: needs.plan.outputs.bumps != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # sole grant: create the bump commits and move the refs
    steps:
      - name: Commit gitlink bumps (GitHub-signed) and fast-forward refs
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMODULE_PATH: ${{ inputs.submodule-path }}
          # Read through the environment, never interpolated into the script.
          BUMPS: ${{ needs.plan.outputs.bumps }}
        run: |
          set -euo pipefail
          note() { printf '%s\n' "$1" | tee -a "${GITHUB_STEP_SUMMARY}"; }
          reject() { m="Not synced: $1."; echo "::warning::${b}: ${m}"; note "- **${b}**: ${m}"; }

          repo="repos/${GITHUB_REPOSITORY}"
          while IFS=$'\t' read -r b head current tip; do
            [ -n "${b}" ] || continue # a here-string of "" still yields one line
            # tree -> commit -> ref are dependent effects, each consuming the
            # previous sha, so one failure arm covers the chain; gh has already
            # printed the HTTP error. mode 160000 is the gitlink, and omitting
            # author/committer/signature is what makes GitHub sign the commit.
            tree=$(jq -nc --arg base "${head}" --arg p "${SUBMODULE_PATH}" --arg s "${tip}" \
                     '{base_tree: $base, tree: [{path: $p, mode: "160000", type: "commit", sha: $s}]}' \
                   | gh api "${repo}/git/trees" --input - -q .sha) \
              && commit=$(jq -nc --arg m "chore: Update skills submodule to ${tip:0:12}" \
                            --arg t "${tree}" --arg p "${head}" \
                            '{message: $m, tree: $t, parents: [$p]}' \
                          | gh api "${repo}/git/commits" --input - -q .sha) \
              && gh api --method PATCH "${repo}/git/refs/heads/${b}" -f sha="${commit}" -F force=false >/dev/null \
              || { reject 'GitHub rejected the update (see the error above); retrying on the next scheduled run'; continue; }
            note "- **${b}**: Updated from ${current:0:12} to ${tip:0:12} (commit ${commit:0:12}, signed by GitHub)."
          done <<<"${BUMPS}"

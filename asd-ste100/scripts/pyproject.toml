[project]
name = "btm-asd-ste100"
version = "1.0.0"
description = "Check text against the ASD-STE100 Issue 9 lexicon and writing rules"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["btm-corekit", "httpx>=0.28,<1", "pydantic>=2.9,<3"]

[project.scripts]
btm-asd-ste100 = "btm_asd_ste100.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
btm-corekit = { workspace = true }

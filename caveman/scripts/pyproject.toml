[project]
name = "btm-caveman"
version = "1.0.0"
description = "Deterministic guard for the caveman compress mode"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["btm-corekit"]

[project.scripts]
btm-caveman = "btm_caveman.cli:entrypoint"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
btm-corekit = { workspace = true }
